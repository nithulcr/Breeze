<!doctype html>
<html lang="zxx">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>club7</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/my-style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap');


        .flex-align {
            display: flex;
            align-items: center;
            justify-content: space-between;

        }

        .border-bottom {
            border-bottom: 1px solid rgba(255, 255, 255, 0.19);
            padding: 10px 0;
            margin-bottom: 10px;
            font-size: 20px;
        }

        .col-12 {
            width: 100%;
        }

        .w-14px {
            width: 14px;
        }

        .register {
            width: 100%;
            display: flex;
        }

        .register-col {
            width: 45%;
            position: relative;
            height: 100vh;
        }
 .register-col.register-left:before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 9;
    background-color: #00000056;
}
img.logo-login {
    position: absolute;
    width: 200px!important;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 9;
}
        .register-left img {
            width: 100%;
        }

        .register-right {
            padding: 50px;

            margin: 0 auto;
            display: flex;
            flex-direction: column;

            height: 100vh;
            overflow: auto;
            box-sizing: border-box;
            width: 55%;
        }

        .register-right>div {

            width: 100%;
        }

        .register h6 {
            font-size: 16px;
            font-weight: 300;
            margin: 15px 0 0 0;
            line-height: 26px;
        }

        .text-gold {
            color: #DEB76C !important;
            text-decoration: underline;
        }

        .register h4 {
            color: #DEB76C;
            font-size: 32px;
            margin: 0;
        }

        .register .logo {
            height: 100px;
            object-fit: contain;
            object-position: left;
            margin-bottom: 35px;
        }

        .form {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .form .input-div {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0;
        }

        .col-md-6 {
            width: calc(50% - 6px);
        }

        .col-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px 0;
        }

        .form input,
        .form select {
            border: 1px solid rgba(209, 185, 125, 0.25);
            border-radius: 4px;
            padding: 5px 20px;
            height: 48px;
            background: rgb(255, 255, 255);
            box-sizing: border-box;
        }



        .register label {
            font-size: 16px;
            margin: 0;
            font-weight: 300;

        }


        .button-site {
            background: var(--main-color);
            color: #fff;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            height: 48px;
            font-weight: 700;
            border-radius: 4px;
            width: 100%;
            margin-top: 53px;
            border: none;
            text-decoration: none;


        }

        .button-site:hover span {
            animation: btn_anim .3s ease;
            height: 100%;


        }

        .button-site label {
            z-index: 9;
            font-weight: 600;
            font-size: 16px;
            margin: 0;

        }

        .button-site span {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            background: #043d3b;
            height: 0%;
            top: 0;
            z-index: 1;
            transition: .3s;
        }

        ::placeholder {
            color: #000000;
        }

        .register h3 {


            margin: 0;

        }

        .register h2 {
            font-weight: 800;
            margin: 0;
            font-size: 50px;
            text-transform: uppercase;
        }

        .register-left-text {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }



        .required {
            position: relative;
            width: fit-content;
        }

        .required:before {
            content: '*';
            position: absolute;
            right: -8px;
            top: 0;
            font-size: 14px;
            color: #D1B97D;
        }

        .btn-outline-club7 {
            border: 1px solid #FFFFFFB2;
            background: #202127;
            color: #D1B97D;
            font-weight: 600;
            height: 38px;
            font-size: 16px;
            display: flex;
            padding: 10px;
            align-items: center;
            justify-content: center;
            border-radius: 0;
            min-width: 120px;
        }

        .btn-outline-club7:hover {
            border: 1px solid #D1B97D;
            color: #D1B97D;
            box-shadow: 3px 3px 5px 2px #D1B97D2b;
            transition: .3s;
        }

        .btn-club7 {
            background: #D1B97D !important;
            color: #422a05 !important;
            height: 38px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
            min-width: 120px;
            font-size: 16px;
        }

        .btn-club7:hover {
            background-color: #D1B97D;
            box-shadow: 3px 3px 5px 2px #D1B97D2b;
            transition: .3s;
        }

        p {
            font-weight: 300;
            font-size: 14px;
        }

        @media(max-width: 768px) {
            .register {
                flex-wrap: wrap;
            }

            .register-col {
                width: 100%;
                height: auto;
            }


            .register {
                overflow: auto;
                height: 100vh;
            }

            .register-left.register-col {
                height: 300px;
            }

            .register-left-text {
                text-align: center;
            }

            .register h6,
            h4 {
                text-align: center;
            }

            .logo {
                display: flex;
                margin: 0 auto;
            }

            .col-md-6 {
                width: 100%;
            }

            .register-right {
                padding: 25px;
            }
        }
    </style>

</head>

<body class="login-bg">


    <section>
        <div class="register">
            <div class="register-left register-col">
                <img src="images/tower.jpg" style="height: 100%;object-fit: cover; " class="register-bg">
                <img src="images/logo-white.png" class="logo-login">
            </div>
            <div class="register-right register-col">
                <a href="index.html" style="width: fit-content;display: flex; text-decoration: none; ">
                    <h3 style="font-size:28px; display:flex;align-items:center; width:fit-content;
                    gap:15px;"><img src="images/back.png" style="width: 20px; filter: invert(1);">Booking Enquiry</h3>
                </a>
                <div class="register-section">

                    <div class="form">


                        <div class="row input-div   ">

                            <div class="col-md-6 col-item">
                                <!-- <label class="font-weight-400 mb-1  required">Full name</label> -->
                                <input type="type" placeholder="Enter First Name" name="" class="input w-100">
                            </div>

                            <div class="col-md-6 col-item">
                                <!-- <label class="font-weight-400 mb-1  required">Email ID</label> -->
                                <input type="email" placeholder="Enter email id" name="" class="input w-100">
                            </div>
                            <div class="col-md-6 col-item">
                                <!-- <label class="font-weight-400 mb-1  required">Contact Number</label> -->
                                <input type="number" placeholder="Enter contact number" name="" class="input w-100">
                            </div>

                            <div class="col-md-6 col-item">
                                <!-- <label class="font-weight-400 mb-1  required">Nationality</label> -->
                                <input type="number" placeholder="Nationality" name="" class="input w-100">
                            </div>

                        </div>
                        <div class="row input-div ">

                            <div class="col-md-6 col-item">
                                <label class="font-weight-400 mb-1  required" for="ApartmentType">Select
                                    Apartment Type *</label>

                                <select id="ApartmentType" name="ApartmentType" class="select-input w-100"
                                    style="min-width: 150px;" required>
                                    <option value="4bhk">4 BHK Apartment (4,958 – 4,969 sqft)</option>
                                    <option value="3bhk">3 BHK Apartment (3,000 – 3,200 sqft)</option>
                                    <option value="2bhk">2 BHK Apartment (2,000 – 2,200 sqft)</option>
                                </select>
                            </div>
                            <div class="col-md-6 col-item">

                                <label for="buyPlan">How Soon You Are Planning to Buy *</label>
                                <select id="buyPlan" name="buyPlan" class="select-input w-100" style="min-width: 150px;"
                                    required>
                                    <option value="immediately">Immediately</option>
                                    <option value="3months">Within 3 Months</option>
                                    <option value="6months">Within 6 Months</option>
                                    <option value="1year">Within 1 Year</option>
                                </select>

                            </div>
                            <div class="col-md-6 col-item">
                                <label for="budgetRange">Enter Your Budget Range *</label>
                                <select id="budgetRange" name="budgetRange" class="select-input w-100"
                                    style="min-width: 150px;" required>
                                    <option value="8M">AED 8 Million</option>
                                    <option value="5M-7M">AED 5-7 Million</option>
                                    <option value="3M-5M">Below AED 5 Million</option>
                                </select>
                            </div>
                            <div class="col-item" style="display: flex; align-items: center; gap: 10px; flex-direction: row;">
                                <input id="disclaimer" type="checkbox" required
                                    style="width: 20px; height: 20px; accent-color: #00575b; position: relative;" />
                                <label for="disclaimer" style="margin-left: 8px;">
                                    User hereby agree with the disclaimer policy when accessing / using this website.
                                </label>
                            </div>


                        </div>
                       
                    </div>
                   
                    <button id="to-register" class="button-site">
                        <label>Register</label>
                        <span></span>
                    </button>
                </div>
                <div class="register-confirm-section" style="display: none;">

                    <div class="p-5">
                        <h5 style="font-size: 36px; color: #0ab767;">Booking Successfull</h5>
                    </div>

                </div>
            </div>
        </div>
    </section>
   
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
        crossorigin="anonymous"></script>


    <script>
        document.getElementById('to-register').addEventListener('click', function () {
            document.querySelector('.register-confirm-section').style.display = 'block';
            document.querySelector('.register-section').style.display = 'none'; // Optionally hide the login section
        });

    </script>

</body>

</html>
